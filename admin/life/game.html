<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1022"><link rel="apple-touch-icon" href="/icon.png">
<title>Life RPG</title><style>
:root{--bg:#0d1022;--panel:#161a33;--panel2:#1d2244;--line:#2c3366;--fg:#eef0ff;--mute:#9aa0c8;--gold:#f5c542;
--mono:ui-monospace,"DejaVu Sans Mono","SF Mono",Menlo,monospace}
*{box-sizing:border-box}
html{font-size:clamp(14px,1.05vw,22px)}
html,body{margin:0;background:var(--bg);color:var(--fg);font:1rem/1.4 var(--mono);overflow-x:hidden}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 1.2rem) 16px calc(env(safe-area-inset-bottom) + 5.5rem);
background-image:linear-gradient(rgba(44,51,102,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(44,51,102,.35) 1px,transparent 1px);background-size:3rem 3rem}
a.back{color:var(--mute);text-decoration:none;font-size:.85rem}
main{display:grid;gap:1.1rem;grid-template-columns:minmax(0,1fr);max-width:1800px;margin:.6rem auto 0}
@media (min-width:1000px){main{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1.1fr)}}
section{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:1.1rem;box-shadow:0 0 0 2px #090b18,6px 6px 0 #090b18;min-width:0}
h2{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 .8rem}
h2:not(:first-child){margin-top:1.4rem}
.hero{text-align:center}
#avatar{width:min(17rem,70vw);aspect-ratio:166/161;margin:0 auto;background:radial-gradient(ellipse 45% 7% at 50% 94%,rgba(0,0,0,.45),transparent),var(--panel2);
border:2px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
#drawn svg{position:absolute;inset:10%;width:80%;height:80%;animation:breathe 2.6s ease-in-out infinite}
#logs{display:contents}
#avatar i{position:absolute;inset:5%;background-repeat:no-repeat;background-size:1600% 100%;image-rendering:pixelated;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-1.2%) scaleY(1.01)}}
h1{font-size:1.6rem;margin:.6rem 0 .1rem;letter-spacing:.04em}
#lvl{font-size:1.15rem;color:var(--gold)}
.xp{height:1rem;background:#090b18;border:2px solid var(--line);margin:.6rem 0 .3rem;position:relative}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,var(--gold));transition:width .6s}
small,.mute{color:var(--mute);font-size:.8rem}
.streaks{display:grid;gap:.4rem;margin-top:1rem;text-align:left}
.streak{display:flex;justify-content:space-between;background:var(--panel2);padding:.45rem .7rem;border-radius:4px}
.skill{margin-bottom:1.1rem}
.skill header{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.skill .xp{height:.7rem;margin:.35rem 0}
.tree{display:flex;align-items:flex-start;margin-top:.45rem}
.node{flex:1;min-width:0;padding:0 .15rem;overflow-wrap:anywhere;display:grid;justify-items:center;gap:.3rem;text-align:center;position:relative;font-size:.7rem;color:var(--mute)}
.node::before{content:"";position:absolute;top:.65rem;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.node:first-child::before{display:none}
.node i{width:1.3rem;height:1.3rem;border:2px solid var(--line);background:#090b18;transform:rotate(45deg);z-index:1}
.node.on{color:var(--fg)}.node.on i{background:var(--c);border-color:var(--c);box-shadow:0 0 .6rem var(--c)}
.node.on::before{background:var(--c)}
.quest{display:grid;grid-template-columns:1.6rem 1fr auto;gap:.6rem;align-items:center;background:var(--panel2);padding:.55rem .7rem;border-radius:4px;margin-bottom:.45rem}
.quest .box{width:1.2rem;height:1.2rem;border:2px solid var(--mute);display:grid;place-items:center;font-size:.8rem}
.quest.done .box{border-color:#4ade80;color:#4ade80}.quest.done b{text-decoration:line-through;color:var(--mute)}
.fuel{display:grid;grid-template-columns:5.5rem 1fr 6.5rem;gap:.5rem;align-items:center;margin-bottom:.35rem;font-size:.85rem}
.fuel .xp{margin:0;height:.7rem}.fuel span:last-child{text-align:right}
.feed div{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.5rem;padding:.3rem 0;border-top:1px dashed var(--line);font-size:.85rem}
.feed div:first-child{border-top:0}.feed b{color:var(--gold)}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;gap:.8rem;align-items:center;justify-content:center;flex-wrap:wrap;
padding:.8rem 16px calc(env(safe-area-inset-bottom) + .8rem);background:rgba(13,16,34,.92);border-top:2px solid var(--line)}
footer button{font:700 1rem var(--mono);color:var(--fg);background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:.7rem 1.2rem;cursor:pointer}
footer button.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
footer button.armed{background:var(--gold);color:#1a1300;border-color:var(--gold)}
#hint{flex-basis:100%;text-align:center}
#toast{position:fixed;left:50%;top:1.2rem;transform:translateX(-50%);background:var(--gold);color:#1a1300;font-weight:700;padding:.8rem 1.4rem;
border-radius:4px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#levelup{position:fixed;inset:0;display:grid;place-items:center;background:rgba(9,11,24,.85);font-size:3rem;font-weight:800;color:var(--gold);
letter-spacing:.1em;opacity:0;pointer-events:none;transition:opacity .4s;text-align:center;z-index:8}
#levelup.show{opacity:1}
#mood{position:absolute;top:4%;right:5%;font-size:2rem;line-height:1;z-index:2;animation:breathe 2.6s ease-in-out infinite}
#avatar.aura{box-shadow:0 0 0 2px #090b18,0 0 1.6rem .3rem var(--gold);border-color:var(--gold)}
#avatar.aura::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 40% 45% at 50% 55%,rgba(245,197,66,.22),transparent 70%);animation:breathe 2.6s ease-in-out infinite}
#banner{display:inline-block;margin-top:.2rem;padding:.15rem .8rem;background:var(--panel2);border:2px solid var(--gold);color:var(--gold);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
#banner:empty{display:none}
.bars{display:grid;gap:.35rem;margin-top:.9rem;text-align:left}
.vital{display:grid;grid-template-columns:4.8rem 1fr 2.6rem;gap:.5rem;align-items:center;font-size:.8rem}
.vital .xp{margin:0;height:.65rem}.vital span:last-child{text-align:right}
.party{display:grid;gap:.4rem;text-align:left}
.member{display:grid;grid-template-columns:1.6rem 1fr auto;gap:.5rem;align-items:center;background:var(--panel2);padding:.4rem .6rem;border-radius:4px;font-size:.8rem}
.member b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.member.forgotten{opacity:.55}
.gear{display:grid;gap:.5rem;text-align:left}
.slot{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;font-size:.75rem}
.slot>span{width:3.4rem;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.slot button{font:.75rem var(--mono);color:var(--fg);background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:.25rem .5rem;cursor:pointer}
.slot button.on{border-color:var(--gold);color:var(--gold)}
.boss{display:grid;grid-template-columns:3rem 1fr;gap:.7rem;align-items:center;background:var(--panel2);padding:.7rem;border-radius:4px}
.boss .emoji{font-size:2.4rem;text-align:center}.boss.down .emoji{filter:grayscale(1);opacity:.6}
.boss .xp{margin:.3rem 0 0;height:.8rem}.boss .xp i{background:linear-gradient(90deg,#ef4444,#f97316)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:.4rem}
.badge{background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:.4rem .5rem;font-size:.75rem;color:var(--mute)}
.badge.on{border-color:var(--gold);color:var(--fg)}.badge b{display:block}
.coop .row{display:grid;grid-template-columns:1fr auto auto;gap:.6rem;align-items:center;background:var(--panel2);padding:.45rem .7rem;border-radius:4px;margin-bottom:.35rem;font-size:.85rem}
.coop .row.me{border:2px solid var(--gold)}
</style></head><body>
<a class="back" id="back" href="/">← Control center</a>
<main>
  <section class="hero"><div id="avatar"><i></i><span id="drawn"></span><b id="mood"></b></div><h1 id="name"></h1><div id="banner"></div><div id="lvl">Loading…</div>
    <div class="xp"><i id="xpbar" style="width:0"></i></div><small id="xp"></small>
    <div class="bars" id="bars"></div>
    <div class="streaks" id="streaks"></div>
    <div id="party-box" hidden><h2>Party</h2><div class="party" id="party"></div></div>
    <div id="gear-box" hidden><h2>Gear</h2><div class="gear" id="gear"></div></div></section>
  <section><div id="boss-box" hidden><h2>This week's boss</h2><div id="boss"></div></div>
    <h2>Skill trees</h2><div id="skills"></div>
    <div id="badges-box" hidden><h2 id="badges-h">Achievements</h2><div class="badges" id="badges"></div></div></section>
  <section><h2>This week's quests</h2><div id="quests"></div>
    <div id="daily-box" hidden><h2>Today's standup</h2><div id="daily"></div></div>
    <div id="coop-box" class="coop" hidden><h2 id="coop-h">Co-op</h2><div id="coop"></div></div>
    <h2>Today's fuel</h2><div id="fuel"></div>
    <h2>Recent XP</h2><div class="feed" id="feed"></div></section>
</main>
<footer><div id="logs"></div>
  <small id="hint">Tap twice to log</small></footer>
<div id="toast"></div><div id="levelup"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const MOD = location.pathname.split('/')[2] || 'life';  // "pi.life" when the Switch's panel serves it
const KIOSK = new URLSearchParams(location.search).get('kiosk');  // "dock" when opened because it was docked
%%KIOSK_JS%%
let lastLevel = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500) }
const pct = (a, b) => Math.max(0, Math.min(100, b ? num(a) / num(b) * 100 : 0)).toFixed(1) + '%';
const num = v => Number.isFinite(+v) ? +v : 0;  // numbers from the state, never markup
const arr = v => Array.isArray(v) ? v : [];      // every newer key may be missing on an older Pi
const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : null;
// Shows a block (its h2 included) only when it has something to draw.
function fill(box, sel, html) { $(box).hidden = !html; $(sel).innerHTML = html || '' }
const MOODS = {great: '😄', happy: '😄', good: '🙂', ok: '🙂', meh: '😐', tired: '😴', sleepy: '😴', sore: '🥵', hungry: '🍽️', sad: '😞', low: '😞'};
const STATUS = {working: '⚙️', waiting: '❗', atpc: '🖥️', stuck: '⚠️', idle: '💤'};
const hm = m => { m = Math.round(num(m)); return m >= 60 ? Math.floor(m / 60) + ' h ' + m % 60 + ' m' : m + ' m' };

function draw(S) {
  avatar(S); logs(arr(S.activities));
  $('#name').textContent = S.name || 'Player';
  $('#lvl').textContent = `Level ${S.level} · ${S.title}`;
  $('#xpbar').style.width = pct(S.into, S.span);
  $('#xp').textContent = `${S.into} / ${S.span} XP · ${S.xp} total`;
  look(S); vitals(S);
  $('#streaks').innerHTML = arr(S.streaks).map(s => `<div class="streak"><span>${esc(s.name)}</span><b>${esc(s.n ? '🔥 ' + num(s.n) : '—')}</b></div>`).join('') + sleep(obj(S.sleep));
  fill('#party-box', '#party', arr(S.party).map(m => `<div class="member${m.forgotten ? ' forgotten' : ''}"><span>${esc(STATUS[m.status] || '•')}</span>
    <span><b>${esc(m.title || m.key)}</b><small>${esc([m.project, m.agent].filter(Boolean).join(' · '))}</small></span><small>Lv ${num(m.level)}</small></div>`).join(''));
  gear(S);
  boss(obj(S.boss));
  $('#skills').innerHTML = arr(S.skills).map(k => `<div class="skill" style="--c:${esc(k.color)}">
    <header><span style="color:${esc(k.color)}">${esc(String(k.name).toUpperCase())}</span><span>Lv ${num(k.level)} <small>${num(k.into)}/${num(k.span)}</small></span></header>
    <div class="xp"><i style="width:${pct(k.into, k.span)};background:${esc(k.color)}"></i></div>
    <div class="tree">${arr(k.perks).map(p => `<div class="node${p.on ? ' on' : ''}"><i></i>${esc(p.name)}<small>Lv ${num(p.at)}</small></div>`).join('')}</div></div>`).join('');
  const badges = arr(S.achievements);
  $('#badges-h').textContent = `Achievements · ${badges.filter(a => a.on).length}/${badges.length}`;
  fill('#badges-box', '#badges', badges.map(a => `<div class="badge${a.on ? ' on' : ''}" title="${esc(a.about || '')}"><b>${esc(a.on ? '🏆 ' + a.name : '🔒 ' + a.name)}</b>
    <small>${esc(a.on ? a.when || '' : a.about || '')}</small></div>`).join(''));
  $('#quests').innerHTML = arr(S.quests).map(q => `<div class="quest${q.done ? ' done' : ''}"><span class="box">${q.done ? '✓' : ''}</span>
    <span><b>${esc(q.name)}</b><br><small>${esc(q.reward || '')}</small></span><span>${num(q.have)}/${num(q.need)}</span></div>`).join('')
    || '<small>Set your goals on the control center.</small>';
  fill('#daily-box', '#daily', arr(S.daily).map(q => `<div class="quest${q.done ? ' done' : ''}"><span class="box">${q.done ? '✓' : ''}</span>
    <span><b>${esc(q.name)}</b></span><span>${num(q.have)}/${num(q.need)}</span></div>`).join(''));
  coop(obj(S.coop));
  const t = obj(S.today) || {}, goals = obj(t.goals) || {}, rows = [['Calories', 'kcal', ''], ['Protein', 'protein', ' g'], ['Carbs', 'carbs', ' g'], ['Fat', 'fat', ' g']];
  $('#fuel').innerHTML = rows.map(([label, k, u]) => `<div class="fuel"><span>${esc(label)}</span><div class="xp"><i style="width:${pct(t[k], goals[k])};background:#4ade80"></i></div>
    <span>${num(t[k])}${esc(goals[k] ? ' / ' + Math.round(num(goals[k])) : '')}${esc(u)}</span></div>`).join('')
    + (arr(t.meals).length ? '' : '<small>No meals logged today.</small>');
  $('#feed').innerHTML = arr(S.feed).map(f => `<div><small>${esc(f.when)}</small><span>${esc(f.text)}</span><b>+${num(f.xp)} ${esc(String(f.skill || 'XP').slice(0, 3).toUpperCase())}</b></div>`).join('')
    || '<small>Log a session or a meal to start.</small>';
  if (lastLevel !== null && S.level > lastLevel) {
    cheer(); typeof rumble === 'function' && rumble(400);
    const l = $('#levelup'); l.innerHTML = `LEVEL UP<br>${num(S.level)} · ${esc(S.title)}`; l.classList.add('show'); setTimeout(() => l.classList.remove('show'), 4000);
  }
  lastLevel = S.level;
}
// Mood emote and the cosmetics that also work over sprite strips: the aura and the title banner.
function look(S) {
  const m = obj(S.mood) || {name: S.mood}, e = m.emoji || MOODS[String(m.name || '').toLowerCase()] || '';
  $('#mood').textContent = e; $('#mood').title = m.name ? String(m.name) : '';
  const eq = obj(S.equipped) || {}, title = arr(S.titles).find(t => t.key === eq.title);
  $('#avatar').classList.toggle('aura', !!eq.aura);
  $('#banner').textContent = title ? title.name : '';
}
function vitals(S) {
  const b = obj(S.bars);
  $('#bars').innerHTML = !b ? '' : [['HP', 'hp', '#ef4444'], ['Energy', 'energy', '#facc15'], ['Stamina', 'stamina', '#38bdf8']]
    .filter(([, k]) => b[k] !== null && b[k] !== undefined)
    .map(([label, k, c]) => `<div class="vital"><span>${esc(label)}</span><div class="xp"><i style="width:${pct(b[k], 100)};background:${esc(c)}"></i></div><span>${num(b[k])}</span></div>`).join('');
}
function sleep(s) {
  if (!s) return '';
  const rows = [];
  if (s.debt_min !== null && s.debt_min !== undefined) rows.push(['Sleep debt', num(s.debt_min) > 0 ? hm(s.debt_min) : 'none']);
  if (s.last) rows.push(['Last night', typeof s.last === 'number' ? hm(s.last) : typeof s.last === 'object' ? hm(s.last.minutes) : String(s.last)]);
  if (s.bedtime_streak) rows.push(['Bedtime streak', '🌙 ' + num(s.bedtime_streak)]);
  if (s.nights_on_time) rows.push(['Nights on time', String(num(s.nights_on_time))]);
  return rows.map(([k, v]) => `<div class="streak"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
}
function boss(b) {
  fill('#boss-box', '#boss', b && `<div class="boss${b.defeated ? ' down' : ''}"><span class="emoji">${esc(b.emoji || '👾')}</span>
    <span><b>${esc(b.name)}</b> <small>${esc(b.defeated ? 'Defeated!' : num(b.hp) + ' / ' + num(b.max) + ' HP')}</small>
    <div class="xp"><i style="width:${pct(b.hp, b.max)}"></i></div><small>${esc(b.defeated ? 'Every quest done this week.' : 'Finish every quest by Sunday to beat it.')}</small></span></div>`);
}
function coop(c) {
  const rows = c ? arr(c.rows) : [];
  $('#coop-h').textContent = c && c.board ? String(c.board) : 'Co-op';
  fill('#coop-box', '#coop', rows.length ? `<div class="xp"><i style="width:${pct(c.total, c.goal)}"></i></div>
    <small>${esc(num(c.total) + ' / ' + num(c.goal) + ' quests done together')}</small>`
    + rows.map(r => `<div class="row${r.me ? ' me' : ''}"><span><b>${esc(r.name)}</b><br><small>${esc('Lv ' + num(r.level) + (r.title ? ' · ' + r.title : ''))}</small></span>
      <span>${esc(r.boss_defeated ? '🏆' : '')}</span><span>${num(r.done)}/${num(r.need)}</span></div>`).join('') : '');
}
// Title and cosmetics you've unlocked; a tap equips one (the panel checks it's really unlocked).
const SLOTS = [['title', 'Title'], ['hat', 'Hat'], ['cape', 'Cape'], ['aura', 'Aura']];
let gearShown = '';
function gear(S) {
  const eq = obj(S.equipped) || {}, cos = arr(S.cosmetics), owned = {title: arr(S.titles).filter(t => t.on)};
  for (const [slot] of SLOTS.slice(1)) owned[slot] = cos.filter(c => c.slot === slot && c.on);
  const html = SLOTS.filter(([slot]) => owned[slot].length).map(([slot, label]) => `<div class="slot"><span>${esc(label)}</span>
    <button data-slot="${esc(slot)}" data-item="" class="${eq[slot] ? '' : 'on'}">none</button>${owned[slot].map(it =>
      `<button data-slot="${esc(slot)}" data-item="${esc(it.key)}" class="${it.key === eq[slot] ? 'on' : ''}">${esc(it.name)}</button>`).join('')}</div>`).join('');
  if (html === gearShown) return;
  gearShown = html; fill('#gear-box', '#gear', html);
}
$('#gear').onclick = async ev => {
  const b = ev.target.closest('button[data-slot]'); if (!b) return;
  const r = await fetch('/action/' + MOD + '/equip/' + encodeURIComponent(b.dataset.slot), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({item: b.dataset.item})});
  const d = await r.json().catch(() => ({message: 'Request failed'}));
  toast(d.message || (r.ok ? 'Equipped.' : 'Request failed')); load();
};
async function load() {
  try { const r = await fetch('/file/' + MOD + '/state/now', {cache: 'no-store'}); if (!r.ok) throw 0; draw(await r.json()) }
  catch (e) { $('#lvl').textContent = "Can't reach the panel" }
}
load(); setInterval(load, 5000);

// The avatar: one 16-frame strip per outfit (0-3 front: stand, step, step, its move; 15 celebrating).
// Mostly standing and breathing; now and then it shifts its weight, and every few beats does its move.
let sprite = null, frame = 0, busyUntil = 0;
function show(f) { frame = f; const i = $('#avatar i'); i.style.backgroundPosition = (f / 15 * 100) + '% 0' }
function avatar(S) {
  if (!S.sprite) {  // no sprite strips: the drawn pixel avatar
    if (sprite !== S.avatar) { sprite = S.avatar; $('#avatar i').style.backgroundImage = 'none'; $('#drawn').innerHTML = S.avatar }
    return;
  }
  if (sprite === S.sprite.url) return;
  $('#drawn').innerHTML = '';
  sprite = S.sprite.url; $('#avatar i').style.backgroundImage = 'url("/' + String(S.sprite.url).replace(/^file\/life\//, 'file/' + MOD + '/').replace(/["\\()]/g, '') + '")'; show(0);
}
function play(seq, ms) { busyUntil = Date.now() + seq.length * ms; seq.forEach((f, k) => setTimeout(() => show(f), k * ms)) }
function cheer() { play([15, 15, 15, 15, 15, 0], 500) }
let beat = 0;
setInterval(() => {
  if (Date.now() < busyUntil) return;
  beat++;
  if (beat % 4 === 0) play([3, 3, 3, 0], 450);                 // its move: the coffee, the dumbbell, the ball
  else if (beat % 2 === 0) play([1, 0, 2, 0], 220);            // a small shift of weight
}, 3500);

// Logging takes two presses (A twice, or two taps) so a stray one never counts.
let buttons = [], shown = '', sel = 0, armed = null;
function logs(list) {  // one button per activity in config "life.activities"
  const key = JSON.stringify(list); if (key === shown) return; shown = key;
  $('#logs').innerHTML = list.map(a => `<button data-kind="${esc(a.kind)}" data-label="${esc(a.label.toLowerCase())}">${esc(a.emoji)} Log ${esc(a.label.toLowerCase())}</button>`).join('');
  buttons = [...document.querySelectorAll('#logs button')]; sel = Math.min(sel, Math.max(0, buttons.length - 1));
  buttons.forEach(b => b.onclick = () => press(b)); mark();
}
function mark() { buttons.forEach((b, i) => { b.classList.toggle('sel', KIOSK && i === sel); b.classList.toggle('armed', b === armed) }) }
async function press(b) {
  if (armed !== b) { armed = b; clearTimeout(press.t); press.t = setTimeout(() => { armed = null; mark() }, 4000); mark(); return toast((KIOSK ? 'Press A' : 'Tap') + ' again to log ' + b.dataset.label) }
  armed = null; mark();
  const r = await fetch('/action/' + MOD + '/log/' + b.dataset.kind, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
  const d = await r.json().catch(() => ({message: 'Request failed'}));
  toast(d.message); if (r.ok && / logged/.test(d.message)) cheer(); load();
}

if (KIOSK) {
  $('#back').hidden = true;
  $('#hint').textContent = 'Joy-Con: ↑↓ choose · A twice to log · + control center';
  mark();
  let prev = {};
  setInterval(() => {
    const gp = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(g => g && g.connected), map = gp && padMap(gp);
    if (!map) return;
    for (const [name, i] of Object.entries(map)) {
      const down = !!(gp.buttons[i] && gp.buttons[i].pressed);
      if (down && !prev[name]) {
        if (name === 'up' || name === 'down') { sel = (sel + (name === 'down' ? 1 : buttons.length - 1)) % buttons.length; armed = null; mark() }
        else if (name === 'a' && buttons[sel]) press(buttons[sel]);
        else if (name === 'b') { armed = null; mark() }
        else if (name === 'plus') location.href = '/?stay=1';
      }
      prev[name] = down;
    }
  }, 40);
  // undocked again: back to the touchscreen panel
  if (KIOSK === 'dock') setInterval(() => { if (screen.width < DOCK_WIDTH) location.href = '/' }, 2000);
  // an agent that starts waiting opens on the panel, as it would there (agents already waiting don't);
  // not at night (/live "quiet"), so a waiting agent doesn't light up the TV
  let seen = null;
  setInterval(async () => {
    try {
      const d = await (await fetch('/live', {cache: 'no-store'})).json(), keys = (d.pager || []).map(a => a.key);
      const fresh = seen && (d.pager || []).find(a => !seen.includes(a.key));
      seen = keys;
      if (fresh && !d.quiet) location.href = '/?stay=1#' + new URLSearchParams({sheet: fresh.sheet, title: '🔔 ' + fresh.title + ' · ' + fresh.project});
    } catch (e) {}
  }, 5000);
}
</script></body></html>
